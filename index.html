<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MetroPath</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <main>
    <section id="home" class="view active">
      <header class="top">
        <div class="brand"><img src="assets/logo.svg" alt="" width="36" height="36"><b>MetroPath</b></div>
        <span class="loc" id="locLabel">Kolkata</span>
      </header>
      <div class="search"><input id="q" placeholder="Where do you want to go?" list="stationList" autocomplete="off"></div>
      <div class="card planner">
        <label class="field"><i class="dot from"></i><input id="from" placeholder="From station" list="stationList" autocomplete="off"></label>
        <label class="field"><i class="dot to"></i><input id="to" placeholder="To station" list="stationList" autocomplete="off"></label>
        <button class="swap" id="swap" aria-label="Swap stations">⇅</button>
        <p class="err" id="homeErr" role="alert"></p>
        <button class="btn" id="findRoute">Find Route</button>
      </div>
      <h2>Nearby stations</h2>
      <div class="card" id="nearby"><button class="btn ghost" id="findNearby">Find Nearby Metro</button><div id="nearbyOut"></div></div>
      <h2>Recent journeys</h2>
      <div id="recents"></div>
    </section>

    <section id="map" class="view">
      <header class="bar"><b>Kolkata Metro</b><input id="mapSearch" placeholder="Search station" list="stationList" autocomplete="off"></header>
      <div id="mapViewport"><img id="mapImg" src="kolkata-metro-map.png" alt="Kolkata Metro route map" draggable="false"></div>
      <div class="zoom"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomFit" aria-label="Fit map">⤢</button></div>
      <div class="sheet" id="mapSheet" hidden></div>
    </section>

    <section id="routes" class="view">
      <header class="bar"><b>Route</b></header>
      <div id="routeOut" class="pad"></div>
    </section>

    <section id="profile" class="view">
      <header class="bar"><b>Profile</b></header>
      <div class="pad"><div class="card"><b>Saved on this device</b><p class="muted">Recent journeys are stored in your browser only.</p><button class="btn ghost" id="clearRecents">Clear recent journeys</button></div></div>
    </section>
  </main>
  <nav class="tabs">
    <button data-v="home" class="on">⌂<span>Home</span></button>
    <button data-v="map">◫<span>Map</span></button>
    <button data-v="routes">⇢<span>Routes</span></button>
    <button data-v="profile">☺<span>Profile</span></button>
  </nav>
</div>
<datalist id="stationList"></datalist>
<script src="./stations.js"></script>
<script src="./graph.js"></script>
<script src="./route.js"></script>
<script src="./location.js"></script>
<script src="./map.js"></script>
<script src="./app.js"></script>
</body>
</html>
